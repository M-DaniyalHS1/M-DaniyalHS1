<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="460"
     viewBox="0 0 1200 460">

  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- ================= TITLE ================= -->

  <text x="35" y="48"
        font-family="Arial, Helvetica, sans-serif"
        font-size="34"
        font-weight="700"
        fill="url(#blueGradient)">
    ABOUT ME
  </text>

  <!-- Header circuit -->

  <path d="M225 36 H400 L420 22 H545"
        fill="none"
        stroke="url(#blueGradient)"
        stroke-width="2"/>

  <circle cx="550" cy="22" r="4" fill="#22d3ee">
    <animate attributeName="opacity"
             values=".3;1;.3"
             dur="2s"
             repeatCount="indefinite"/>
  </circle>


  <!-- ================= TEXT ================= -->

  <g font-family="Arial, Helvetica, sans-serif"
     font-size="18"
     fill="#c9d1d9">

    <text x="35" y="95">
      🚀 Building modern
      <tspan fill="#38bdf8" font-weight="700">
        Full-Stack Web Applications
      </tspan>

      <animate attributeName="opacity"
               values="0;1;1"
               keyTimes="0;.08;1"
               dur="8s"
               repeatCount="indefinite"/>
    </text>


    <text x="35" y="127">
      🤖 Developing
      <tspan fill="#38bdf8" font-weight="700">
        Agentic AI systems and AI-powered applications
      </tspan>

      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;.04;.12;1"
               dur="8s"
               repeatCount="indefinite"/>
    </text>


    <text x="35" y="159">
      🐍 Working with
      <tspan fill="#38bdf8" font-weight="700">
        Python, FastAPI &amp; Django
      </tspan>

      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;.08;.16;1"
               dur="8s"
               repeatCount="indefinite"/>
    </text>


    <text x="35" y="191">
      ⚛ Building interactive frontends with
      <tspan fill="#38bdf8" font-weight="700">
        React &amp; JavaScript
      </tspan>

      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;.12;.20;1"
               dur="8s"
               repeatCount="indefinite"/>
    </text>


    <text x="35" y="223">
      🎨 Creating responsive interfaces using
      <tspan fill="#38bdf8" font-weight="700">
        HTML, CSS &amp; Tailwind CSS
      </tspan>

      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;.16;.24;1"
               dur="8s"
               repeatCount="indefinite"/>
    </text>


    <text x="35" y="255">
      🗄 Working with
      <tspan fill="#38bdf8" font-weight="700">
        PostgreSQL, Supabase, SQLite &amp; SQLAlchemy
      </tspan>

      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;.20;.28;1"
               dur="8s"
               repeatCount="indefinite"/>
    </text>


    <text x="35" y="287">
      🔐 Authentication using
      <tspan fill="#38bdf8" font-weight="700">
        JWT &amp; OAuth2
      </tspan>

      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;.24;.32;1"
               dur="8s"
               repeatCount="indefinite"/>
    </text>


    <text x="35" y="319">
      🔗 Designing and integrating
      <tspan fill="#38bdf8" font-weight="700">
        REST APIs
      </tspan>

      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;.28;.36;1"
               dur="8s"
               repeatCount="indefinite"/>
    </text>


    <text x="35" y="351">
      ⚙ Automating workflows using
      <tspan fill="#38bdf8" font-weight="700">
        n8n
      </tspan>

      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;.32;.40;1"
               dur="8s"
               repeatCount="indefinite"/>
    </text>


    <text x="35" y="383">
      🧠 Exploring
      <tspan fill="#38bdf8" font-weight="700">
        LLMs, AI Agents, tool calling and AI automation
      </tspan>

      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;.36;.44;1"
               dur="8s"
               repeatCount="indefinite"/>
    </text>


    <text x="35" y="415">
      ☁ Learning modern
      <tspan fill="#38bdf8" font-weight="700">
        cloud deployment and production workflows
      </tspan>

      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;.40;.48;1"
               dur="8s"
               repeatCount="indefinite"/>
    </text>

  </g>


  <!-- ================= COMPUTER ================= -->

  <g transform="translate(875 145)">

    <!-- screen -->

    <rect x="25"
          y="20"
          width="240"
          height="175"
          rx="15"
          fill="#0d1117"
          stroke="#3b82f6"
          stroke-width="3"/>


    <!-- window dots -->

    <circle cx="45" cy="40" r="4" fill="#22d3ee"/>
    <circle cx="60" cy="40" r="4" fill="#3b82f6"/>
    <circle cx="75" cy="40" r="4" fill="#8b5cf6"/>


    <!-- animated code -->

    <rect x="50" y="70"
          width="110" height="6"
          rx="3"
          fill="#22d3ee">

      <animate attributeName="width"
               values="50;110;50"
               dur="3s"
               repeatCount="indefinite"/>

    </rect>


    <rect x="50" y="94"
          width="145" height="6"
          rx="3"
          fill="#3b82f6">

      <animate attributeName="width"
               values="80;145;80"
               dur="3.5s"
               repeatCount="indefinite"/>

    </rect>


    <rect x="50" y="118"
          width="90" height="6"
          rx="3"
          fill="#8b5cf6">

      <animate attributeName="width"
               values="40;90;40"
               dur="2.7s"
               repeatCount="indefinite"/>

    </rect>


    <rect x="50" y="142"
          width="125" height="6"
          rx="3"
          fill="#22d3ee">

      <animate attributeName="width"
               values="70;125;70"
               dur="3.2s"
               repeatCount="indefinite"/>

    </rect>


    <!-- code symbol -->

    <text x="185"
          y="165"
          font-family="monospace"
          font-size="30"
          font-weight="700"
          fill="#c9d1d9">
      &lt;/&gt;
    </text>


    <!-- laptop base -->

    <path d="M5 195 H285 L310 218 H-20 Z"
          fill="#161b22"
          stroke="#3b82f6"
          stroke-width="3"/>


    <!-- bottom animated line -->

    <line x1="20"
          y1="220"
          x2="270"
          y2="220"
          stroke="url(#blueGradient)"
          stroke-width="4"
          stroke-linecap="round">

      <animate attributeName="opacity"
               values=".4;1;.4"
               dur="2s"
               repeatCount="indefinite"/>

    </line>


    <!-- floating terminal -->

    <g>
      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0;0 -6;0 0"
                        dur="3s"
                        repeatCount="indefinite"/>

      <rect x="-30"
            y="70"
            width="70"
            height="50"
            rx="8"
            fill="#0d1117"
            stroke="#22d3ee"
            stroke-width="2"/>

      <text x="-15"
            y="102"
            font-family="monospace"
            font-size="22"
            fill="#38bdf8">
        &gt;_
      </text>
    </g>

  </g>

</svg>
