<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="460"
     viewBox="0 0 1000 460">

  <defs>

    <!-- Animated gradient for highlighted text -->
    <linearGradient id="flow"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">

      <stop offset="0%" stop-color="#00eaff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>

      <animate
        attributeName="x1"
        values="-100%;100%"
        dur="4s"
        repeatCount="indefinite"/>

      <animate
        attributeName="x2"
        values="0%;200%"
        dur="4s"
        repeatCount="indefinite"/>

    </linearGradient>

    <!-- Small glow -->
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <style>

    .title {
      font-family: Arial, sans-serif;
      font-size: 34px;
      font-weight: 800;
      fill: url(#flow);
    }

    .row {
      font-family: Arial, sans-serif;
      font-size: 19px;
      font-weight: 500;
      fill: #c9d1d9;

      opacity: 0;

      animation:
        appear 12s ease-in-out infinite;
    }

    .tech {
      font-weight: 700;
      fill: url(#flow);
      filter: url(#glow);
    }

    @keyframes appear {

      0% {
        opacity: 0;
        transform: translateX(-14px);
      }

      8% {
        opacity: 1;
        transform: translateX(0);
      }

      88% {
        opacity: 1;
        transform: translateX(0);
      }

      96%,100% {
        opacity: 0;
        transform: translateX(8px);
      }
    }

    .r1  { animation-delay: 0s; }
    .r2  { animation-delay: .25s; }
    .r3  { animation-delay: .50s; }
    .r4  { animation-delay: .75s; }
    .r5  { animation-delay: 1s; }
    .r6  { animation-delay: 1.25s; }
    .r7  { animation-delay: 1.50s; }
    .r8  { animation-delay: 1.75s; }
    .r9  { animation-delay: 2s; }
    .r10 { animation-delay: 2.25s; }
    .r11 { animation-delay: 2.50s; }

  </style>


  <!-- NO BACKGROUND RECT -->


  <!-- TITLE -->

  <text x="35" y="50" class="title">
    👨‍💻 ABOUT ME
  </text>


  <!-- CONTENT -->

  <text x="35" y="100" class="row r1">
    🚀 Building modern
    <tspan class="tech"> Full-Stack Web Applications</tspan>
  </text>


  <text x="35" y="132" class="row r2">
    🤖 Developing
    <tspan class="tech"> Agentic AI systems &amp; AI-powered applications</tspan>
  </text>


  <text x="35" y="164" class="row r3">
    🐍 Working with
    <tspan class="tech"> Python, FastAPI &amp; Django</tspan>
  </text>


  <text x="35" y="196" class="row r4">
    ⚛️ Building interactive frontends with
    <tspan class="tech"> React &amp; JavaScript</tspan>
  </text>


  <text x="35" y="228" class="row r5">
    🎨 Creating responsive interfaces using
    <tspan class="tech"> HTML, CSS &amp; Tailwind CSS</tspan>
  </text>


  <text x="35" y="260" class="row r6">
    🗄️ Working with
    <tspan class="tech"> PostgreSQL, Supabase, SQLite &amp; SQLAlchemy</tspan>
  </text>


  <text x="35" y="292" class="row r7">
    🔐 Authentication using
    <tspan class="tech"> JWT &amp; OAuth2</tspan>
  </text>


  <text x="35" y="324" class="row r8">
    🔗 Designing and integrating
    <tspan class="tech"> REST APIs</tspan>
  </text>


  <text x="35" y="356" class="row r9">
    ⚙️ Automating workflows using
    <tspan class="tech"> n8n</tspan>
  </text>


  <text x="35" y="388" class="row r10">
    🧠 Exploring
    <tspan class="tech"> LLMs, AI Agents, Tool Calling &amp; AI Automation</tspan>
  </text>


  <text x="35" y="420" class="row r11">
    ☁️ Learning
    <tspan class="tech"> Cloud Deployment &amp; Production Workflows</tspan>
  </text>

</svg>
