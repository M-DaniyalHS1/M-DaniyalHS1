<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Patience, Consistency, Dua (prayers), Tawakkal, Strength and courage</title>
  <desc id="description">Five phrases fade in and out one at a time in a repeating loop. Thanku for visiting my profile glows underneath.</desc>
  <defs>
    <linearGradient id="patience"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="consistency"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <linearGradient id="dua"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#a3e635"/></linearGradient>
    <linearGradient id="tawakkal"><stop stop-color="#c084fc"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="strength"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <linearGradient id="thanks"><stop stop-color="#67e8f9"/><stop offset=".5" stop-color="#93c5fd"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <linearGradient id="divider"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#818cf8" stop-opacity=".6"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <!-- Transparent canvas. Five non-overlapping 2-second turns in a 10-second loop. -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="700" font-size="52">
    <text x="600" y="120" fill="url(#patience)">Patience
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.15;.20;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="120" fill="url(#consistency)" opacity="0">Consistency
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.20;.24;.35;.40;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="120" fill="url(#dua)" opacity="0">Dua (prayers)
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.40;.44;.55;.60;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="120" fill="url(#tawakkal)" opacity="0">Tawakkal
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.60;.64;.75;.80;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="120" fill="url(#strength)" opacity="0">Strength and courage
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.80;.84;.95;1" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>
  <path d="M340 157H860" fill="none" stroke="url(#divider)" stroke-width="1.5"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" text-anchor="middle">
    <text x="600" y="219" fill="url(#thanks)" filter="url(#glow)" opacity=".4" aria-hidden="true">Thanku for visiting my profile
      <animate attributeName="opacity" values=".25;.65;.25" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="219" fill="url(#thanks)">Thanku for visiting my profile
      <animate attributeName="opacity" values=".85;1;.85" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
