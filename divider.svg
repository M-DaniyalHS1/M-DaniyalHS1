<svg width="100%" height="40" viewBox="0 0 1000 40"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Moving gradient -->
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00eaff">
        <animate attributeName="stop-color"
          values="#00eaff;#7c3aed;#ff00cc;#00eaff"
          dur="6s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#7c3aed">
        <animate attributeName="stop-color"
          values="#7c3aed;#00eaff;#ff00cc;#7c3aed"
          dur="6s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#ff00cc">
        <animate attributeName="stop-color"
          values="#ff00cc;#7c3aed;#00eaff;#ff00cc"
          dur="6s"
          repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main line -->
  <line
    x1="20"
    y1="20"
    x2="980"
    y2="20"
    stroke="url(#gradient)"
    stroke-width="2"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Moving glowing particle -->
  <circle
    cx="20"
    cy="20"
    r="4"
    fill="#ffffff"
    filter="url(#glow)">

    <animate
      attributeName="cx"
      values="20;980;20"
      dur="5s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="r"
      values="3;6;3"
      dur="1s"
      repeatCount="indefinite"
    />
  </circle>

</svg>
