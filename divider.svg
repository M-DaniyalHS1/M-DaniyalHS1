<svg width="100%" height="32" viewBox="0 0 1200 32"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Animated gradient -->
    <linearGradient id="flowGradient"
                    x1="-100%" y1="0%"
                    x2="0%" y2="0%">

      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="25%" stop-color="#008CFF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="75%" stop-color="#FF2BD6"/>
      <stop offset="100%" stop-color="#00F5FF"/>

      <!-- Makes whole gradient FLOW -->
      <animate
        attributeName="x1"
        values="-100%;100%"
        dur="3s"
        repeatCount="indefinite"/>

      <animate
        attributeName="x2"
        values="0%;200%"
        dur="3s"
        repeatCount="indefinite"/>

    </linearGradient>


    <!-- Strong glow -->
    <filter id="neonGlow"
            x="-20%" y="-300%"
            width="140%" height="700%">

      <feGaussianBlur
        stdDeviation="5"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- Moving white shine -->
    <linearGradient id="shine"
                    x1="-40%" y1="0%"
                    x2="0%" y2="0%">

      <stop offset="0%"
            stop-color="white"
            stop-opacity="0"/>

      <stop offset="45%"
            stop-color="white"
            stop-opacity="0"/>

      <stop offset="50%"
            stop-color="white"
            stop-opacity="0.95"/>

      <stop offset="55%"
            stop-color="white"
            stop-opacity="0"/>

      <stop offset="100%"
            stop-color="white"
            stop-opacity="0"/>

      <animate
        attributeName="x1"
        values="-60%;120%"
        dur="2.5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="x2"
        values="-20%;160%"
        dur="2.5s"
        repeatCount="indefinite"/>

    </linearGradient>

  </defs>


  <!-- Soft glowing background line -->
  <line
    x1="20"
    y1="16"
    x2="1180"
    y2="16"
    stroke="url(#flowGradient)"
    stroke-width="8"
    stroke-linecap="round"
    opacity="0.35"
    filter="url(#neonGlow)"
  />


  <!-- Main animated gradient line -->
  <line
    x1="20"
    y1="16"
    x2="1180"
    y2="16"
    stroke="url(#flowGradient)"
    stroke-width="3"
    stroke-linecap="round"
    filter="url(#neonGlow)"
  />


  <!-- Shine travelling over entire line -->
  <line
    x1="20"
    y1="16"
    x2="1180"
    y2="16"
    stroke="url(#shine)"
    stroke-width="4"
    stroke-linecap="round"
  />

</svg>
