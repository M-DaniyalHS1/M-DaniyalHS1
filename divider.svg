<svg width="100%" height="40" viewBox="0 0 1200 40"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Repeating animated neon gradient -->
    <linearGradient id="neonFlow"
                    x1="0" y1="0"
                    x2="1200" y2="0"
                    gradientUnits="userSpaceOnUse"
                    spreadMethod="repeat">

      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="15%" stop-color="#008CFF"/>
      <stop offset="30%" stop-color="#7A5CFF"/>
      <stop offset="45%" stop-color="#D946EF"/>
      <stop offset="60%" stop-color="#FF2BD6"/>
      <stop offset="75%" stop-color="#7A5CFF"/>
      <stop offset="90%" stop-color="#008CFF"/>
      <stop offset="100%" stop-color="#00F7FF"/>

      <!-- MOVE THE ENTIRE GRADIENT -->
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="-1200 0"
        to="1200 0"
        dur="4s"
        repeatCount="indefinite"/>

    </linearGradient>


    <!-- Neon glow -->
    <filter id="glow"
            x="-20%" y="-400%"
            width="140%" height="900%">

      <feGaussianBlur
        stdDeviation="5"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- Large soft glow -->
  <line
    x1="20"
    y1="20"
    x2="1180"
    y2="20"
    stroke="url(#neonFlow)"
    stroke-width="10"
    stroke-linecap="round"
    opacity="0.20"
    filter="url(#glow)"
  />


  <!-- Main flowing line -->
  <line
    x1="20"
    y1="20"
    x2="1180"
    y2="20"
    stroke="url(#neonFlow)"
    stroke-width="3"
    stroke-linecap="round"
    filter="url(#glow)"
  />

</svg>
